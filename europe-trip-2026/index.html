<style>
/* Layout: one full-screen stage; each slide is a blurred fill + the uncropped photo, caption bottom-left, control bar along the bottom. Committed dark viewer. */
:root{
  --night:#0B1020; --ink:#F4EFE4; --dim:rgba(244,239,228,.66); --gold:#E2B54A; --glass:rgba(11,16,32,.55); --line:rgba(244,239,228,.18);
  --display:"Bodoni Moda",Didot,"Bodoni 72",Georgia,serif;
  --ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);overflow:hidden}
body{font-family:var(--ui);-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;background:var(--night);user-select:none;-webkit-user-select:none}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .9s ease}
.slide.on{opacity:1}
.fill{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;filter:blur(38px) brightness(.45) saturate(1.2)}
.main{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:transparent}
.slide.on img.main{animation:drift 6s ease-out forwards}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.045)}}
@media (prefers-reduced-motion:reduce){.slide{transition:none}.slide.on img.main{animation:none}}
.shade{position:absolute;inset:auto 0 0 0;height:42%;background:linear-gradient(to top,rgba(6,9,18,.86),rgba(6,9,18,0));pointer-events:none}
.cap{position:absolute;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:900px}
.cap .where{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
.cap .what{font-family:var(--display);font-style:italic;font-weight:500;font-size:clamp(22px,4.2vw,40px);line-height:1.15;text-wrap:balance;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.cap .when{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.badge{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));right:max(18px,env(safe-area-inset-right,0px));font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 11px;pointer-events:none}

.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.card .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.38) saturate(1.1)}
.card > *:not(.bg){position:relative}
.card .eyebrow{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:600}
.card h1{font-family:var(--display);font-weight:500;font-size:clamp(40px,9vw,96px);line-height:1;margin:0;text-wrap:balance}
.card h1 i{font-weight:400;color:var(--gold)}
.card h2{font-family:var(--display);font-style:italic;font-weight:500;font-size:clamp(44px,10vw,110px);line-height:1;margin:0}
.card p{margin:0;color:var(--dim);font-size:16px;max-width:46ch}
.route{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.route b{color:var(--ink);font-weight:600}
.big{margin-top:10px;font:600 15px var(--ui);letter-spacing:.06em;color:var(--night);background:var(--gold);border:0;border-radius:999px;padding:14px 30px;cursor:pointer}
.fine{font-size:12px !important;opacity:.8}
.big:focus-visible,.ctl:focus-visible,.chap:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

#prog{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:3px;background:var(--line);z-index:5}
#prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s linear}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  background:linear-gradient(to top,rgba(6,9,18,.7),rgba(6,9,18,0));transition:opacity .4s}
body.idle #bar,body.idle #prog,body.idle .badge{opacity:0}
body.idle{cursor:none}
.ctl{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font:600 12px var(--ui)}
.ctl svg{width:18px;height:18px;fill:currentColor}
.ctl.play{width:50px;height:50px;background:var(--gold);color:var(--night);border:0}
#count{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:70px}
#np{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26vw}
.chaps{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.chap{font:500 12px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer}
.chap.on{color:var(--night);background:var(--ink);border-color:var(--ink)}
@media (max-width:640px){ .chaps{display:none} #fs,#np{display:none} #bar{gap:8px} .cap{bottom:calc(80px + env(safe-area-inset-bottom,0px))} .spacer{flex:1} }
.spacer{flex:0}
</style>

: "Saturday, October 24", "tm": "2:57 PM", "w": null, "h": null, "dur": 8.0}, {"f": "media/v23879.mp4", "v": true, "c": "Flying home", "ch": "london", "d": "Saturday, October 24", "tm": "2:59 PM", "w": null, "h": null, "dur": 8.0}];
const MUSIC={
  paris:[["music/trip-music-paris1.mp3","Paris Cafe · BFCMUSIC"],["music/trip-music-paris2.mp3","Once In Paris · Pumpupthemind"],["music/trip-music-paris3.mp3","Golden Lights of Paris · MarkMusicStudio"]],
  riviera:[["music/trip-music-riv1.mp3","French House · Aurec"],["music/trip-music-riv2.mp3","Sweet Life · AlexGrohl"]],
  london:[["music/trip-music-lon1.mp3","2 Step Into London · catch22music"],["music/trip-music-lon2.mp3","London Underground · TokyoRifft"],["music/trip-music-lon3.mp3","London Chillhop · DesiFreeMusic"]]
};
const CH={paris:{name:"Paris",sub:"October 17 – 18",eyebrow:"Chapter one"},
          riviera:{name:"Monaco & Menton",sub:"October 18 – 20 · the French Riviera",eyebrow:"Chapter two"},
          london:{name:"London",sub:"October 20 – 24",eyebrow:"Chapter three"}};
const WHERE={paris:"Paris",riviera:"French Riviera",london:"London"};
const PHOTO_MS=4200, CARD_MS=3200;
const NP=ITEMS.filter(x=>!x.v).length, NV=ITEMS.filter(x=>x.v).length;
const SEQ=[{k:"title"}]; let last=null;
ITEMS.forEach((it,i)=>{ if(it.ch!==last){SEQ.push({k:"chapter",ch:it.ch,cover:ITEMS.slice(i).find(x=>!x.v&&x.ch===it.ch&&x.w>x.h&&!/flight|flying|heading/i.test(x.c))});last=it.ch;} SEQ.push({k:"item",it,n:i+1}); });
const stage=document.getElementById('stage'), bar=document.querySelector('#prog i'), count=document.getElementById('count');
const mus=document.getElementById('mus'), np=document.getElementById('np');
let idx=0, playing=false, timer=null, cur=null, speed=1, muted=false, started=false;
const SPEEDS=[1,1.5,2];
function el(h){const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

/* ---------- music: one playlist per chapter, crossfaded when the chapter changes ---------- */
let mch=null, mi=0, fadeT=null;
function fadeTo(v,ms,done){ clearInterval(fadeT); const from=mus.volume, t0=performance.now();
  fadeT=setInterval(()=>{ const p=Math.min(1,(performance.now()-t0)/ms); mus.volume=Math.max(0,Math.min(1,from+(v-from)*p)); if(p>=1){clearInterval(fadeT); done&&done();} },50); }
function loadTrack(){ const t=MUSIC[mch][mi%MUSIC[mch].length]; mus.src=t[0]; np.textContent="♪ "+t[1]; mus.volume=0;
  const p=mus.play(); if(p&&p.catch) p.catch(()=>{}); fadeTo(.55,1400); }
function setMusic(ch){
  if(!started||ch===mch) return;
  const go=()=>{ mch=ch; mi=0; loadTrack(); };
  if(mch&&!mus.paused) fadeTo(0,700,go); else go();
}
mus.addEventListener('ended',()=>{ if(!mch) return; mi++; loadTrack(); });
function syncMusic(){ if(!started||!mch) return; if(playing&&!muted){ const p=mus.play(); if(p&&p.catch) p.catch(()=>{}); } else mus.pause(); }

/* ---------- slides ---------- */
function render(s){
  if(s.k==="title"){
    const cover=ITEMS.find(x=>!x.v&&x.ch==="paris"&&x.c.indexOf("Eiffel")>-1&&x.w>x.h)||ITEMS.find(x=>!x.v);
    return el(`<div class="slide"><div class="card"><img class="bg" src="${cover.f}" alt="">
      <div class="eyebrow">October 2026</div>
      <h1>Paris, the Riviera <i>&amp;</i> London</h1>
      <div class="route"><b>Paris</b><span>→</span><b>Monaco</b><span>→</span><b>Menton</b><span>→</span><b>London</b></div>
      <p>Eight days. ${NP} photos and ${NV} video clips, with a soundtrack for each city.</p>
      <button class="big" id="start">Play the trip</button>
      <p class="fine">Turn your sound on. Tap or press the arrow keys to skip, and use the speed button to go faster.</p></div></div>`);
  }
  if(s.k==="chapter"){
    const c=CH[s.ch];
    return el(`<div class="slide"><div class="card">${s.cover?`<img class="bg" src="${s.cover.f}" alt="">`:''}
      <div class="eyebrow">${c.eyebrow}</div><h2>${c.name}</h2><p>${c.sub}</p></div></div>`);
  }
  const it=s.it;
  const media = it.v
    ? `<video class="main" src="${it.f}" muted playsinline preload="auto"></video>`
    : `<img class="fill" src="${it.f}" alt=""><img class="main" src="${it.f}" alt="${esc(it.c)}">`;
  return el(`<div class="slide">${media}<div class="shade"></div>${it.v?'<div class="badge">Video</div>':''}
    <div class="cap"><div class="where">${WHERE[it.ch]}</div><div class="what">${esc(it.c)}</div><div class="when">${it.d} · ${it.tm}</div></div></div>`);
}
const warm={};
function preload(i){ for(let j=i+1;j<=i+4&&j<SEQ.length;j++){ const s=SEQ[j]; if(s.k!=="item"||warm[s.it.f]) continue; warm[s.it.f]=1;
  if(s.it.v){ const v=document.createElement('video'); v.preload='auto'; v.muted=true; v.src=s.it.f; v.load(); } else { const im=new Image(); im.src=s.it.f; } } }
function show(i){
  clearTimeout(timer); idx=Math.max(0,Math.min(SEQ.length-1,i));
  const s=SEQ[idx], node=render(s); stage.appendChild(node);
  requestAnimationFrame(()=>requestAnimationFrame(()=>node.classList.add('on')));
  const old=cur; cur=node;
  if(old){ old.classList.remove('on'); const v=old.querySelector('video'); if(v) v.pause(); setTimeout(()=>old.remove(),1000); }
  const st=node.querySelector('#start'); if(st) st.onclick=e=>{e.stopPropagation(); started=true; playing=true; syncPP(); setMusic('paris'); show(1);};
  bar.style.width=(idx/(SEQ.length-1)*100)+'%';
  count.textContent = s.k==="item" ? `${s.n} / ${ITEMS.length}` : '';
  const ch=s.ch||(s.it&&s.it.ch); document.querySelectorAll('.chap').forEach(b=>b.classList.toggle('on', ch===b.dataset.ch));
  if(ch&&s.k!=="title") setMusic(ch);
  preload(idx); schedule();
}
function schedule(){
  clearTimeout(timer);
  const s=SEQ[idx], v=cur&&cur.querySelector('video');
  if(!playing){ if(v) v.pause(); return; }
  if(s.k==="title"){ return; }
  if(s.k==="item"&&s.it.v){
    v.playbackRate=speed; v.onended=()=>advance(); v.onerror=()=>advance();
    const p=v.play(); if(p&&p.catch) p.catch(()=>{ timer=setTimeout(advance,PHOTO_MS/speed); });
    timer=setTimeout(advance,((s.it.dur||8)*1000+2500)/speed); return;
  }
  timer=setTimeout(advance,(s.k==="chapter"?CARD_MS:PHOTO_MS)/speed);
}
function advance(){ clearTimeout(timer); if(idx<SEQ.length-1) show(idx+1); else { playing=false; syncPP(); syncMusic(); } }
function syncPP(){
  const b=document.getElementById('pp'), i=document.getElementById('ppi');
  b.setAttribute('aria-label',playing?'Pause':'Play');
  i.innerHTML=playing?'<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>':'<path d="M8 5v14l11-7z"/>';
}
function toggle(){
  if(!started){ const st=document.getElementById('start'); if(st) st.click(); return; }
  playing=!playing; syncPP(); syncMusic(); if(playing&&idx>=SEQ.length-1&&!timer){ show(0); return; } schedule();
}
document.getElementById('pp').onclick=toggle;
document.getElementById('next').onclick=()=>show(idx+1);
document.getElementById('prev').onclick=()=>show(idx-1);
document.querySelectorAll('.chap').forEach(b=>b.onclick=()=>{ if(!started){started=true;playing=true;syncPP();} show(SEQ.findIndex(s=>s.k==="chapter"&&s.ch===b.dataset.ch)); });
document.getElementById('spd').onclick=e=>{ speed=SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length]; e.currentTarget.textContent=speed+'×'; const v=cur&&cur.querySelector('video'); if(v) v.playbackRate=speed; schedule(); };
document.getElementById('snd').onclick=e=>{ muted=!muted; e.currentTarget.style.opacity=muted?.5:1; e.currentTarget.setAttribute('aria-label',muted?'Unmute music':'Mute music'); syncMusic(); };
document.getElementById('fs').onclick=()=>{ try{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){} };
addEventListener('keydown',e=>{ if(e.key==='ArrowRight')show(idx+1); else if(e.key==='ArrowLeft')show(idx-1); else if(e.key===' '){e.preventDefault();toggle();} });
let tx=null; stage.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
stage.addEventListener('touchend',e=>{ if(tx==null)return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>40) show(idx+(dx<0?1:-1)); });
let idleT; const wake=()=>{document.body.classList.remove('idle'); clearTimeout(idleT); idleT=setTimeout(()=>{ if(playing) document.body.classList.add('idle'); },3000);};
['mousemove','touchstart','keydown'].forEach(ev=>addEventListener(ev,wake,{passive:true})); wake();
const h=parseInt(location.hash.slice(1)); show(Number.isFinite(h)&&h>0&&h<SEQ.length?h:0);
</script>
