name: Refresh Recruiter Activity Board

on:
  schedule:
    # Weekdays, Eastern time: 11:40 AM (midday email) and 3:55 PM (end-of-day email).
    # Each is listed twice so it works in both daylight time (UTC-4) and standard time (UTC-5).
    # Extra runs just refresh the website; the email step sends each email only once a day.
    - cron: "40 15,16 * * 1-5"
    - cron: "55 19,20 * * 1-5"
  workflow_dispatch:
    inputs:
      email:
        description: "Email to send: auto (by time of day), midday, eod, or none"
        default: "auto"
      test:
        description: "Send only to Greg (true/false)"
        default: "false"
      date:
        description: "Re-run a past day (YYYY-MM-DD). Saves recruiter-activity/days/<date>.js only; sends no email."
        default: ""

permissions:
  contents: write

concurrency:
  group: refresh-recruiter-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pull today's numbers from DataLink
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          REPORT_DATE: ${{ inputs.date }}
        run: node scripts/refresh-recruiter-activity.mjs
      - name: Publish
        run: |
          git add -A recruiter-activity/data.js recruiter-activity/days
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git config user.name "ce-reports-bot"
          git config user.email "ce-reports-bot@users.noreply.github.com"
          git commit -m "Refresh recruiter activity ${{ inputs.date }} $(TZ=America/New_York date '+%a %b %d %I:%M %p ET')"
          git push
      - name: Send team email
        if: ${{ github.event_name == 'schedule' || (inputs.email != 'none' && inputs.date == '') }}
        env:
          M365_TENANT_ID: ${{ secrets.M365_TENANT_ID }}
          M365_CLIENT_ID: ${{ secrets.M365_CLIENT_ID }}
          M365_CLIENT_SECRET: ${{ secrets.M365_CLIENT_SECRET }}
        run: |
          node scripts/send-recruiter-email.mjs "${{ inputs.email || 'auto' }}" "${{ inputs.test == 'true' && 'test' || '' }}"
          if git diff --quiet -- recruiter-activity/email-log.json 2>/dev/null && ! git ls-files --others --exclude-standard | grep -q email-log; then exit 0; fi
          git config user.name "ce-reports-bot"
          git config user.email "ce-reports-bot@users.noreply.github.com"
          git add recruiter-activity/email-log.json
          git commit -m "Log recruiter email $(TZ=America/New_York date '+%a %b %d %I:%M %p ET')"
          git push
