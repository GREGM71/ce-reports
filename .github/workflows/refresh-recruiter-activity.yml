name: Refresh Recruiter Activity Board

on:
  schedule:
    # Weekdays, Eastern time: 11:40 AM (for the 12:00 email) and 3:55 PM (for the 4:15 email).
    # Each is listed twice so it works in both daylight time (UTC-4) and standard time (UTC-5);
    # the extra runs just refresh the website again (12:40 / 4:55 PM in summer, 10:40 AM / 2:55 PM in winter).
    - cron: "40 15,16 * * 1-5"
    - cron: "55 19,20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-recruiter-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pull today's numbers from DataLink
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: node scripts/refresh-recruiter-activity.mjs
      - name: Publish
        run: |
          if git diff --quiet -- recruiter-activity/data.js; then echo "No change."; exit 0; fi
          git config user.name "ce-reports-bot"
          git config user.email "ce-reports-bot@users.noreply.github.com"
          git add recruiter-activity/data.js
          git commit -m "Refresh recruiter activity $(TZ=America/New_York date '+%a %b %d %I:%M %p ET')"
          git push
