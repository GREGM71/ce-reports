name: Refresh Recruiter Activity Board

on:
  schedule:
    # Weekdays 3:30 PM Eastern, ahead of the 3:45 PM email. Two times so it works in both
    # daylight and standard time (19:30 UTC = 3:30 PM EDT, 20:30 UTC = 3:30 PM EST).
    # The extra run (4:30 PM EDT in summer) just refreshes again.
    - cron: "30 19 * * 1-5"
    - cron: "30 20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-recruiter-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pull today's numbers from DataLink
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: node scripts/refresh-recruiter-activity.mjs
      - name: Publish
        run: |
          if git diff --quiet -- recruiter-activity/data.js; then echo "No change."; exit 0; fi
          git config user.name "ce-reports-bot"
          git config user.email "ce-reports-bot@users.noreply.github.com"
          git add recruiter-activity/data.js
          git commit -m "Refresh recruiter activity $(TZ=America/New_York date '+%a %b %d %I:%M %p ET')"
          git push
